<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<title>Vélo’v e-bikes nearby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E9EEF1; --surface:#FFFFFF; --ink:#14222E; --muted:#5A6976; --line:#CDD6DD;
  --charge:#F5C518; --charge-ink:#14222E; --off:#9AA7B1; --warn:#B3261E;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;
    --bg:#10181F; --surface:#18232C; --ink:#E8EEF2; --muted:#93A2AE; --line:#2A3945;
    --off:#5C6B77; --warn:#FF8A80;}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.45 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:34rem;margin:0 auto;padding:1rem 1.1rem 2rem}

header{display:flex;align-items:center;justify-content:space-between;gap:1rem;color:var(--muted);font-size:.9rem}
#place{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{display:flex;flex:none;white-space:nowrap;align-items:center;gap:.45rem;font:inherit;color:inherit;background:none;
  border:0;border-radius:999px;padding:.3rem .5rem;margin:-.3rem -.5rem;cursor:pointer}
.tick:hover{color:var(--ink)}
.ring{width:18px;height:18px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .track{stroke:var(--line)}
.ring .sweep{stroke:var(--ink);stroke-dasharray:44;stroke-dashoffset:44}
.ring.run .sweep{animation:sweep var(--poll) linear forwards}
@keyframes sweep{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ring.run .sweep{animation:none;stroke-dashoffset:0}}

/* When an e-bike appears after none: the best row/marker pulses (and the phone buzzes). */
.flash{animation:flash .9s ease-out 2}
@keyframes flash{50%{scale:1.12}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

.controls{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:1.2rem 0 1rem}
.layout{display:flex;gap:.35rem;margin-left:auto}
.chip{font:500 .95rem var(--body);color:var(--ink);background:transparent;white-space:nowrap;
  border:1.5px solid var(--line);border-radius:999px;padding:.3rem .65rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:379px){.chip{font-size:.88rem;padding:.3rem .5rem}.controls,.layout{gap:.3rem}}

/* Compact pickers (radius, refresh interval): a chip that drops down a short menu over the content. */
.pick{position:relative}
.pick .k{color:var(--muted);font-weight:400}
.pick .caret{margin-left:.25rem;font-size:.7em;color:var(--muted)}
.pick-btn[aria-expanded="true"]{border-color:var(--ink)}
.menu{position:absolute;top:calc(100% + .35rem);left:0;z-index:10;min-width:100%;display:flex;flex-direction:column;
  padding:.3rem;background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.25)}
.menu[hidden]{display:none}
.menu button{font:500 1rem var(--body);color:var(--ink);background:none;border:0;border-radius:8px;
  padding:.55rem .9rem;text-align:left;white-space:nowrap;cursor:pointer}
.menu button:hover{background:var(--bg)}
.menu button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:3px solid var(--charge);outline-offset:2px}

ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li a{display:grid;grid-template-columns:3.6rem 1fr auto;gap:.9rem;align-items:center;
  padding:.75rem 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.pill{font:700 1.6rem/1 var(--cond);text-align:center;padding:.3rem 0;border-radius:8px;
  background:var(--charge);color:var(--charge-ink);font-variant-numeric:tabular-nums}
.pill.zero{background:transparent;color:var(--off);box-shadow:inset 0 0 0 2px var(--line)}
li.best .pill{font-size:2rem;padding:.4rem 0;box-shadow:0 0 0 3px var(--ink)}
li.best .name{font-size:1.1rem}
.listnote{margin:0 0 .8rem;color:var(--muted)}
.listnote:empty{display:none}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub,.side{color:var(--muted);font-size:.88rem}
.side{text-align:right}
li.closed{opacity:.5}

[data-layout="map"] #list,[data-layout="map"] .listnote,[data-layout="list"] #map{display:none}

/* Map layout: hand-rolled Web Mercator view centred on the user, scaled to the radius.
   Markers draw immediately; OpenStreetMap tiles fade in underneath whenever they arrive. */
#map{position:relative;height:min(70svh,40rem);min-height:18rem;border-radius:14px;overflow:hidden;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
#map .tiles img{position:absolute;max-width:none;opacity:0;transition:opacity .3s;pointer-events:none}
#map .tiles img.on{opacity:1}
#map .tiles{filter:saturate(.55) brightness(1.03)}             /* mute OSM colours so markers stand out */
@media (prefers-color-scheme:dark){#map .tiles{filter:invert(1) hue-rotate(180deg) saturate(.5) brightness(.85) contrast(.9)}}
#map .range{position:absolute;border:2px dashed var(--muted);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#map .me{position:absolute;width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(26,115,232,.2),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 .35rem;border:0;border-radius:8px;
  font:700 1.15rem/30px var(--cond);font-variant-numeric:tabular-nums;text-align:center;cursor:pointer;
  background:var(--charge);color:var(--charge-ink);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.zero{background:var(--surface);color:var(--off);box-shadow:inset 0 0 0 2px var(--off),0 1px 3px rgba(0,0,0,.25)}
.pin.closed{opacity:.5}
.pin.best{min-width:42px;height:42px;line-height:42px;font-size:1.6rem;border-radius:10px;z-index:1;
  box-shadow:0 0 0 3px var(--ink),0 2px 8px rgba(0,0,0,.45)}
.pin[aria-pressed="true"]{z-index:2;outline:3px solid var(--ink);outline-offset:3px}
.mapnote{position:absolute;top:.6rem;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;
  background:var(--surface);color:var(--ink);padding:.3rem .8rem;border-radius:999px;font-size:.9rem;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mapnote:empty{display:none}
.attr{position:absolute;right:0;bottom:0;margin:0;padding:.05rem .35rem;font-size:.65rem;color:var(--muted);
  background:var(--surface);opacity:.85;border-top-left-radius:6px}
.attr a{color:inherit}
#card{position:absolute;left:.6rem;right:.6rem;bottom:1.5rem;z-index:3;display:grid;grid-template-columns:3rem 1fr auto auto;
  gap:.8rem;align-items:center;background:var(--surface);border-radius:12px;padding:.7rem .6rem .7rem .8rem;
  box-shadow:0 4px 18px rgba(0,0,0,.3);-webkit-user-select:text;user-select:text}
#card[hidden]{display:none}
#card > div{min-width:0}
#card .go{font-weight:600;color:var(--ink);white-space:nowrap}
#card .close{font:400 1.5rem/1 var(--body);color:var(--muted);background:none;border:0;padding:.2rem .4rem;cursor:pointer}

#msg{margin:1rem 0;color:var(--warn)}
#msg:empty{display:none}
footer{margin-top:2rem;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main data-layout="map">
  <header>
    <span id="place">Finding your location…</span>
    <button type="button" class="tick" id="refresh" title="Refresh now" aria-label="Refresh bike counts now">
      <svg class="ring" viewBox="0 0 18 18" aria-hidden="true"><circle class="track" cx="9" cy="9" r="7"/><circle class="sweep" cx="9" cy="9" r="7"/></svg>
      <span id="age">–</span>
    </button>
  </header>

  <div class="controls">
    <div class="pick" id="radiusPick"></div>
    <div class="pick" id="everyPick"></div>
    <div class="layout" role="group" aria-label="Layout">
      <button type="button" class="chip" data-layout="map">Map</button>
      <button type="button" class="chip" data-layout="list">List</button>
    </div>
  </div>

  <div id="map">
    <div class="tiles"></div>
    <div class="range"></div>
    <div class="me" hidden></div>
    <div class="pins"></div>
    <p class="mapnote" aria-live="polite"></p>
    <div id="card" hidden></div>
    <p class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p>
  </div>

  <p class="listnote" aria-live="polite"></p>
  <ol id="list"></ol>
  <p id="msg" role="alert"></p>
  <footer>Live data from Métropole de Lyon and JCDecaux (Licence Ouverte). Refreshes only while this page is open.</footer>
</main>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const GBFS = q.get("gbfs") || "https://download.data.grandlyon.com/files/rdata/jcd_jcdecaux.jcdvelov/gbfs.json";
  const PROXY = q.get("proxy");                       // e.g. "/velov/" to rewrite the feed origin through your own server
  const RADII = [300, 500, 800, 1200], EVERY = [5, 10, 20];
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch {} }
  };
  // Refresh interval in seconds: ?every= wins, then the saved choice, then 20 s. Never below 5 s.
  let every = Math.max(5, +q.get("every") || (EVERY.includes(+store.get("every")) ? +store.get("every") : 20));
  const $ = id => document.getElementById(id);
  const setRingDuration = () => document.documentElement.style.setProperty("--poll", every * 1000 + "ms");
  setRingDuration();
  let radius = RADII.includes(+store.get("radius")) ? +store.get("radius") : 500;
  let layout = store.get("layout") === "list" ? "list" : "map";
  let selected = null;                                   // station_id whose card is open on the map

  let pos = null, info = null, statusUrl = null, electric = new Set();
  let stations = null, fetchedAt = 0, dataAt = 0, timer = null, watchId = null, hadEbike = null, busy = false;

  const via = url => PROXY ? url.replace(/^https?:\/\/[^/]+\//, PROXY) : url;
  async function feed(url){
    const r = await fetch(via(url), { cache: "no-store" });
    if (!r.ok) throw new Error(`The feed answered HTTP ${r.status}.`);
    return r.json();
  }
  const data = async url => (await feed(url)).data;

  async function discover(){
    const d = await data(GBFS);
    const list = d.feeds || Object.values(d)[0].feeds;      // GBFS v3 : v2
    const f = Object.fromEntries(list.map(x => [x.name, x.url]));
    statusUrl = f.station_status;
    const [si, vt] = await Promise.all([
      data(f.station_information),
      f.vehicle_types ? data(f.vehicle_types).catch(() => null) : null
    ]);
    info = new Map(si.stations.map(s => [s.station_id, s]));
    if (vt) electric = new Set(vt.vehicle_types
      .filter(t => (t.propulsion_type || "human") !== "human").map(t => t.vehicle_type_id));
  }

  async function poll(){
    if (document.hidden || busy) return;
    busy = true; restartRing();
    try {
      if (!info) await discover();
      const st = await feed(statusUrl), lu = st.last_updated;     // GBFS v2: POSIX seconds; v3: RFC 3339
      stations = st.data.stations;
      fetchedAt = Date.now();
      dataAt = (typeof lu === "number" ? lu * 1000 : Date.parse(lu)) || 0;
      showAge();
      $("msg").textContent = "";
      render();
    } catch (e) {
      $("msg").textContent = e instanceof TypeError
        ? "Couldn’t reach the Vélo’v feed. Check your connection; if it persists, the browser is blocking the cross-origin request, so serve this page with ?proxy=/velov/ (see setup notes)."
        : e.message;
    } finally { busy = false; }
  }

  const ebikes = s => "num_ebikes_available" in s ? s.num_ebikes_available
    : (s.vehicle_types_available || []).reduce((n, v) => n + (electric.has(v.vehicle_type_id) ? v.count : 0), 0);
  const nameOf = i => typeof i.name === "string" ? i.name : (i.name?.[0]?.text ?? i.station_id);
  function dist(a, b, c, d){
    const r = Math.PI / 180, p1 = a * r, p2 = c * r;
    const h = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((d - b) * r / 2) ** 2;
    return 2 * 6371000 * Math.asin(Math.sqrt(h));
  }
  const metres = d => d < 1000 ? `${Math.round(d / 10) * 10} m` : `${(d / 1000).toFixed(1)} km`;
  const walk = d => `${Math.max(1, Math.round(d / 80))} min walk`;
  const directions = r => `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lon}&travelmode=walking`;
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  const detail = r => r.open ? `${metres(r.d)}, ${walk(r.d)}` : `${metres(r.d)}, station closed`;

  function render(){
    let all = null, near = [], best = null, flashId = null;
    if (stations && info && pos) {
      all = stations.map(s => {
        const i = info.get(s.station_id);
        if (!i) return null;
        const e = ebikes(s);
        return { id: s.station_id, name: nameOf(i), lat: i.lat, lon: i.lon, e,
          classic: Math.max(0, (s.num_bikes_available ?? 0) - e),
          open: s.is_renting !== false && s.is_renting !== 0,
          d: dist(pos.lat, pos.lon, i.lat, i.lon) };
      }).filter(Boolean);
      near = all.filter(r => r.d <= radius).sort((a, b) => a.d - b.d);
      best = near.find(r => r.open && r.e > 0) || null;
      if (hadEbike === false && best) { flashId = best.id; navigator.vibrate?.([120, 80, 120]); }
      hadEbike = !!best;
    }
    if (layout === "map") renderMap(all, best, flashId);
    else renderList(all, near, best, flashId);
  }

  const status = (all, best, rows) => !pos ? "Waiting for your location…" : !all ? "Loading stations…"
    : best ? "" : rows ? `No stations within ${metres(radius)}. Widen the radius.`
    : `No e-bikes within ${metres(radius)}. Widen the radius, or keep this page open: it checks again shortly.`;

  function renderList(all, rows, best, flashId){
    document.querySelector(".listnote").textContent = status(all, best, all && !rows.length);
    $("list").replaceChildren(...rows.map(r => {
      const li = el("li", [r.open ? "" : "closed", r === best ? "best" : "", r.id === flashId ? "flash" : ""].join(" ").trim() || null), a = el("a");
      a.href = directions(r); a.target = "_blank"; a.rel = "noopener";
      const mid = el("div");
      mid.append(el("div", "name", r.name), el("div", "sub", detail(r)));
      a.append(el("span", r.e ? "pill" : "pill zero", r.e), mid, el("span", "side", `${r.classic} classic`));
      li.append(a); return li;
    }));
  }

  const TILE = 256, tiles = new Map();
  // Web Mercator, in pixels at (fractional) zoom z.
  function project(lat, lon, z){
    const size = TILE * 2 ** z, sin = Math.sin(lat * Math.PI / 180);
    return [(lon + 180) / 360 * size, (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * size];
  }

  // Street tiles are decoration: requested in the background, faded in on load, never awaited.
  function drawTiles(z, left, top, w, h){
    const zt = Math.max(0, Math.min(19, Math.ceil(z))), size = TILE * 2 ** (z - zt);
    const layer = $("map").querySelector(".tiles"), keep = new Set();
    for (let x = Math.floor(left / size); x * size < left + w; x++)
      for (let y = Math.floor(top / size); y * size < top + h; y++) {
        const key = `${zt}/${x}/${y}`;
        keep.add(key);
        let img = tiles.get(key);
        if (!img) {
          img = el("img"); img.alt = ""; img.decoding = "async"; img.draggable = false;
          img.onload = () => img.classList.add("on");
          img.src = `https://tile.openstreetmap.org/${key}.png`;
          tiles.set(key, img); layer.append(img);
        }
        const l = Math.round(x * size - left), t = Math.round(y * size - top);
        img.style.cssText = `left:${l}px;top:${t}px;width:${Math.round((x + 1) * size - left) - l}px;height:${Math.round((y + 1) * size - top) - t}px`;
      }
    for (const [key, img] of tiles) if (!keep.has(key)) { img.remove(); tiles.delete(key); }
  }

  function renderMap(all, best, flashId){
    const box = $("map"), w = box.clientWidth, h = box.clientHeight;
    const pins = box.querySelector(".pins"), me = box.querySelector(".me"), range = box.querySelector(".range");
    box.querySelector(".mapnote").textContent = best || !all ? status(all, best) : `No e-bikes within ${metres(radius)}`;
    if (!pos || !w) return;

    const mpp = radius / Math.max(40, Math.min(w, h) / 2 - 28);           // metres per pixel: radius fits the view
    const z = Math.min(20, Math.log2(156543.034 * Math.cos(pos.lat * Math.PI / 180) / mpp));
    const [cx, cy] = project(pos.lat, pos.lon, z), left = cx - w / 2, top = cy - h / 2;
    drawTiles(z, left, top, w, h);
    me.hidden = false; me.style.left = w / 2 + "px"; me.style.top = h / 2 + "px";
    const ring = 2 * radius / mpp;
    range.style.cssText = `left:${w / 2}px;top:${h / 2}px;width:${ring}px;height:${ring}px`;
    if (!all) return;

    const rank = r => r === best ? 3 : r.open && r.e ? 2 : r.open ? 1 : 0; // later = drawn on top
    const shown = all.map(r => { const [x, y] = project(r.lat, r.lon, z); return { r, x: x - left, y: y - top }; })
      .filter(({ x, y }) => x > -24 && x < w + 24 && y > -24 && y < h + 24)
      .sort((a, b) => rank(a.r) - rank(b.r));
    const focused = pins.contains(document.activeElement) ? document.activeElement.dataset.id : null;
    pins.replaceChildren(...shown.map(({ r, x, y }) => {
      const b = el("button", "pin" + (r === best ? " best" : "") + (r.e ? "" : " zero") + (r.open ? "" : " closed") + (r.id === flashId ? " flash" : ""), r.e);
      b.type = "button"; b.dataset.id = r.id;
      b.style.left = x + "px"; b.style.top = y + "px";
      b.setAttribute("aria-label", `${r.name}: ${r.e} e-bike${r.e === 1 ? "" : "s"}, ${detail(r)}`);
      b.setAttribute("aria-pressed", r.id === selected);
      b.onclick = ev => { ev.stopPropagation(); selected = selected === r.id ? null : r.id; render(); };
      return b;
    }));
    if (focused) [...pins.children].find(b => b.dataset.id === focused)?.focus();
    showCard(all.find(r => r.id === selected));
  }

  function showCard(r){
    const card = $("card");
    card.hidden = !r;
    if (!r) return card.replaceChildren();
    const mid = el("div");
    mid.append(el("div", "name", r.name), el("div", "sub", `${detail(r)} · ${r.classic} classic`));
    const go = el("a", "go", "Directions");
    go.href = directions(r); go.target = "_blank"; go.rel = "noopener";
    const x = el("button", "close", "×");
    x.type = "button"; x.setAttribute("aria-label", "Close");
    x.onclick = () => { selected = null; render(); };
    card.replaceChildren(el("span", r.e ? "pill" : "pill zero", r.e), mid, go, x);
  }

  $("card").onclick = ev => ev.stopPropagation();
  $("map").onclick = () => { if (selected) { selected = null; render(); } };
  new ResizeObserver(() => { if (layout === "map") render(); }).observe($("map"));

  function restartRing(){
    const ring = document.querySelector(".ring");
    ring.classList.remove("run"); void ring.getBoundingClientRect(); ring.classList.add("run");
  }
  // How old the data is, per the feed's own last_updated; falls back to fetch time if the feed omits it.
  function showAge(){
    if (!fetchedAt) return;
    const s = Math.max(0, Math.round((Date.now() - (dataAt || fetchedAt)) / 1000));
    $("age").textContent = `${dataAt ? "data from" : "fetched"} ${s < 120 ? `${s} s` : `${Math.round(s / 60)} min`} ago`;
  }
  setInterval(showAge, 1000);

  function locate(){
    if (!("geolocation" in navigator)) { $("place").textContent = "Location not supported"; return; }
    watchId = navigator.geolocation.watchPosition(
      p => { pos = { lat: p.coords.latitude, lon: p.coords.longitude };
             $("place").textContent = `Your location, ±${Math.round(p.coords.accuracy)} m`; render(); },
      e => { $("place").textContent = "Location unavailable";
             $("msg").textContent = e.code === 1
               ? "Location access is blocked. Allow it for this site in your browser settings, then reload."
               : `Couldn’t get your location: ${e.message}`; },
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
  }

  function start(){
    if (timer) return;
    locate(); poll(); timer = setInterval(poll, every * 1000);
  }
  function stop(){
    clearInterval(timer); timer = null;
    if (watchId != null) navigator.geolocation.clearWatch(watchId), watchId = null;
  }
  // Manual refresh: fetch now and restart the countdown from zero.
  // Fetch now and restart the countdown from zero.
  function refreshNow(){
    if (!timer) return;
    clearInterval(timer); timer = setInterval(poll, every * 1000);
    poll();
  }
  $("refresh").onclick = () => { if (!busy) refreshNow(); };
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());

  // A chip showing "<prefix> <value> ▾" that drops down a menu of values; closes on pick, outside tap or Escape.
  const closers = [];
  const closeMenus = except => closers.forEach(c => c !== except && c());
  function picker(host, prefix, values, fmt, get, set){
    const btn = el("button", "chip pick-btn"), menu = el("div", "menu");
    btn.type = "button"; btn.setAttribute("aria-haspopup", "menu"); btn.setAttribute("aria-expanded", "false");
    menu.setAttribute("role", "menu"); menu.setAttribute("aria-label", prefix); menu.hidden = true;
    const items = values.map(v => {
      const b = el("button", null, fmt(v));
      b.type = "button"; b.setAttribute("role", "menuitemradio");
      b.onclick = () => { close(true); set(v); sync(); };
      return { v, b };
    });
    const sync = () => {
      btn.replaceChildren(el("span", "k", prefix + " "), el("span", null, fmt(get())), el("span", "caret", "▾"));
      items.forEach(({ v, b }) => b.setAttribute("aria-checked", v === get()));
    };
    const close = refocus => {
      if (menu.hidden) return;
      menu.hidden = true; btn.setAttribute("aria-expanded", "false");
      if (refocus) btn.focus();
    };
    btn.onclick = () => {
      if (!menu.hidden) return close();
      closeMenus(close);
      menu.hidden = false; btn.setAttribute("aria-expanded", "true");
      (items.find(i => i.v === get()) || items[0]).b.focus();
    };
    menu.onkeydown = ev => {
      const i = items.findIndex(x => x.b === document.activeElement), n = items.length;
      if (ev.key === "Escape") close(true);
      else if (ev.key === "ArrowDown") items[(i + 1) % n].b.focus();
      else if (ev.key === "ArrowUp") items[(i - 1 + n) % n].b.focus();
      else return;
      ev.preventDefault();
    };
    menu.append(...items.map(i => i.b));
    host.append(btn, menu);
    closers.push(close); sync();
  }
  document.addEventListener("click", ev => { if (!ev.target.closest(".pick")) closeMenus(); });

  picker($("radiusPick"), "Within", RADII, metres, () => radius, r => {
    radius = r; store.set("radius", r); hadEbike = null; render();
  });
  picker($("everyPick"), "Every", EVERY, v => `${v} s`, () => every, v => {
    every = v; store.set("every", v); setRingDuration(); refreshNow();
  });

  const main = document.querySelector("main"), layoutButtons = document.querySelectorAll(".layout button");
  function setLayout(l){
    layout = l; main.dataset.layout = l; store.set("layout", l);
    layoutButtons.forEach(b => b.setAttribute("aria-pressed", b.dataset.layout === l));
    render();
  }
  layoutButtons.forEach(b => b.onclick = () => setLayout(b.dataset.layout));
  setLayout(layout);

  if (!document.hidden) start();
})();
</script>
</body>
</html>
